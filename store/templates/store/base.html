<!DOCTYPE html>
<html>
<head>

    <title>
        {% block title %}
        VELISSE
        {% endblock %}
    </title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffaf8;
            color: #292525;
        }

        header {
            background: white;
            padding: 22px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee5e2;
        }

        .logo {
            font-size: 28px;
            letter-spacing: 7px;
        }

        nav {
            display: flex;
            gap: 25px;
            align-items: center;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: #333;
        }

        nav a:hover {
            color: #9b7770;
        }

        @media (max-width: 800px) {

            header {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }

            nav {
                justify-content: center;
                gap: 15px;
            }

        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>

<header>

    <div class="logo">
        VELISSE
    </div>

    <nav>

        <a href="{% url 'product_list' %}">
            Home
        </a>

        <a href="{% url 'shop' %}">
            Shop
        </a>

        <a href="{% url 'about' %}">
            About
        </a>

        <a href="{% url 'contact' %}">
            Contact
        </a>

        <a href="{% url 'cart' %}">
            🛒 Cart
        </a>

        {% if user.is_authenticated %}

            <a href="{% url 'my_orders' %}">
                My Orders
            </a>

            <a href="{% url 'logout' %}">
                Logout
            </a>

        {% else %}

            <a href="{% url 'login' %}">
                Login
            </a>

            <a href="{% url 'register' %}">
                Register
            </a>

        {% endif %}

    </nav>

</header>


{% block content %}
{% endblock %}


</body>
</html>
